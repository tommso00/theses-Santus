apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  # Su minikube l'Ingress risponde a qualsiasi host (niente vincolo su smartgrid.local).
  - path: webproxy-ingress-no-host-patch.yaml
    target:
      group: networking.k8s.io
      version: v1
      kind: Ingress
      name: webproxy
      namespace: smartgrid

labels:
  - pairs:
      environment: minikube
