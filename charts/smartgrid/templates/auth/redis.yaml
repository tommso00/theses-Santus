{{- $labels := dict "root" $ "app" "redis" "component" "auth" -}}
# Redis: sessioni di OAuth2 Proxy (non persistente: se riparte, si rifà il login).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels:
    {{- include "smartgrid.labels" $labels | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        {{- include "smartgrid.labels" (merge (dict "pod" true) $labels) | nindent 8 }}
    spec:
      containers:
        - name: redis
          {{- include "smartgrid.image" (dict "root" $ "name" "redis") | nindent 10 }}
          ports:
            - containerPort: 6379
          resources:
            {{- toYaml .Values.auth.redis.resources | nindent 12 }}
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    {{- include "smartgrid.labels" $labels | nindent 4 }}
spec:
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
# Redis non ha password: l'unica protezione è che solo OAuth2 Proxy lo raggiunga.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-ingress
  labels:
    {{- include "smartgrid.labels" $labels | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: oauth2-proxy
      ports:
        - protocol: TCP
          port: 6379
