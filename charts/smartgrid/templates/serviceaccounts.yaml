{{/* =========================================================================
     Fix misconfig 1 (STRIDE riga 4) - ServiceAccount dedicati per componente.

     Invece del ServiceAccount "default" condiviso da tutti i pod, ogni gruppo
     funzionale (openems, pmu, timedata, auth) ha la propria identità, con il
     token NON montato automaticamente (nessun componente del progetto usa
     l'API Kubernetes). Così un eventuale RoleBinding non si propaga a tutti i
     pod e non c'è alcun token da rubare da un pod compromesso.
     I pod impostano serviceAccountName e automountServiceAccountToken: false.
     ========================================================================= */}}
{{- range $c := list "openems" "pmu" "timedata" "auth" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: smartgrid-{{ $c }}
  labels:
    {{- include "smartgrid.labels" (dict "root" $ "app" (printf "smartgrid-%s" $c) "component" $c) | nindent 4 }}
automountServiceAccountToken: false
---
{{- end }}
