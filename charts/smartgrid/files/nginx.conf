{{- /* Configurazione del WebProxy. Renderizzata dal chart con "tpl": le rotte
       di Edge e bridge sono generate dalla topologia (values: edges). */ -}}
{{- $topo := include "smartgrid.topology" . | fromJson -}}
worker_processes auto;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  types_hash_max_size 4096;
  server_tokens off;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  log_format detailed '$remote_addr - $remote_user [$time_local] '
                      '"$request" $status $body_bytes_sent '
                      '"$http_referer" "$http_user_agent" '
                      'upstream: $upstream_addr';

  # ---- Upstream (il wait-dns del WebProxy aspetta tutti questi Service)
  upstream oauth2_proxy       { server oauth2-proxy:4180; }
  upstream keycloak_upstream  { server keycloak:8080; }
  upstream openems_ui         { server openems-ui:80; }
  upstream openems_backend_ws { server openems-backend:8082; }
{{- range $e := $topo.edges }}
  upstream {{ $e.id }}_rest     { server {{ $e.name }}:8084; }
  upstream {{ $e.id }}_ws       { server {{ $e.name }}:8085; }
{{- range $p := $e.pipelines }}
  upstream {{ $p.bridge | replace "-" "_" }} { server {{ $p.bridge }}:8000; }
{{- end }}
{{- end }}

  server {
    listen 80;
    server_name _;
    access_log /var/log/nginx/access.log detailed;

    # ---- Monitoraggio (senza login)
    location = /monitor { return 301 /monitor/; }
    location = /monitor/ {
      default_type application/json;
      return 200 '{"service":"webproxy","status":"ok"}';
    }
{{- range $e := $topo.edges }}
{{- range $p := $e.pipelines }}
    location = /monitor/edges/{{ $e.id }}/bridges/{{ int $p.index }}/health { proxy_pass http://{{ $p.bridge | replace "-" "_" }}/health; }
    location = /monitor/edges/{{ $e.id }}/bridges/{{ int $p.index }}/status { proxy_pass http://{{ $p.bridge | replace "-" "_" }}/status; }
{{- end }}
{{- end }}

    # ---- Autenticazione
    location = /oauth2/auth {
      internal;
      proxy_pass http://oauth2_proxy;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header X-Original-URL $scheme://$http_host$request_uri;
      proxy_set_header X-Forwarded-Uri $request_uri;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header Host $host;
    }

    # Redirect al login che conserva l'URL richiesto (rd = redirect dopo il login).
    location @oauth2_signin {
      return 302 /oauth2/start?rd=$request_uri;
    }

    location /oauth2/ {
      proxy_pass http://oauth2_proxy;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Scheme $scheme;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Uri $request_uri;
      proxy_set_header X-Original-URL $scheme://$http_host$request_uri;
      # Header grandi (cookie di sessione)
      proxy_buffer_size 16k;
      proxy_buffers 4 32k;
      proxy_busy_buffers_size 64k;
    }

    location = /auth { return 301 /auth/; }
    location /auth/ {
      proxy_pass http://keycloak_upstream/auth/;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Port 80;
      proxy_set_header X-Forwarded-Prefix /auth;
    }
    location /realms/    { proxy_pass http://keycloak_upstream/auth/realms/; }
    location /resources/ { proxy_pass http://keycloak_upstream/auth/resources/; }
    location /js/        { proxy_pass http://keycloak_upstream/auth/js/; }

    # ---- OpenEMS Backend: WebSocket della UI (tutti gli Edge)
    location = /backend-ws { return 301 /backend-ws/; }
    location /backend-ws/ {
      auth_request /oauth2/auth;
      error_page 401 = @oauth2_signin;
      rewrite ^/backend-ws(.*) /$1 break;
      proxy_pass http://openems_backend_ws;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    # ---- Accesso diretto ai singoli Edge (WebSocket 8085 e JSON-RPC 8084)
{{- range $e := $topo.edges }}
    location = /edges/{{ $e.id }}/ws { return 301 /edges/{{ $e.id }}/ws/; }
    location /edges/{{ $e.id }}/ws/ {
      auth_request /oauth2/auth;
      error_page 401 = @oauth2_signin;
      proxy_pass http://{{ $e.id }}_ws/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }
    # API: senza sessione risponde 401 (nessun redirect HTML).
    location ~ ^/edges/{{ $e.id }}/jsonrpc/?$ {
      auth_request /oauth2/auth;
      rewrite ^ /jsonrpc break;
      proxy_pass http://{{ $e.id }}_rest;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
{{- end }}

    # ---- UI di OpenEMS
    location = /backend-ui { return 301 /backend-ui/; }
    location /backend-ui/ {
      auth_request /oauth2/auth;
      error_page 401 = @oauth2_signin;
      proxy_pass http://openems_ui/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      auth_request /oauth2/auth;
      error_page 401 = @oauth2_signin;
      proxy_pass http://openems_ui/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
