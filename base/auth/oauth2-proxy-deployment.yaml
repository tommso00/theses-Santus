apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy
  namespace: smartgrid
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oauth2-proxy
  template:
    metadata:
      labels:
        app: oauth2-proxy
    spec:
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.8.1
          ports:
            - containerPort: 4180
          env:
            - name: OAUTH2_PROXY_PROVIDER
              value: oidc
            - name: OAUTH2_PROXY_OIDC_ISSUER_URL
              value: "http://smartgrid.local/auth/realms/openems"
            - name: OAUTH2_PROXY_CLIENT_ID
              value: openems-gateway
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: auth-secrets
                  key: OAUTH2_PROXY_CLIENT_SECRET
            - name: OAUTH2_PROXY_REDIRECT_URL
              value: "http://smartgrid.local/oauth2/callback"
            - name: OAUTH2_PROXY_EMAIL_DOMAINS
              value: "*"
            - name: OAUTH2_PROXY_UPSTREAMS
              value: "static://202"
            - name: OAUTH2_PROXY_HTTP_ADDRESS
              value: "0.0.0.0:4180"
            - name: OAUTH2_PROXY_REVERSE_PROXY
              value: "true"
            - name: OAUTH2_PROXY_SET_XAUTHREQUEST
              value: "true"
            - name: OAUTH2_PROXY_PASS_ACCESS_TOKEN
              value: "true"
            - name: OAUTH2_PROXY_SKIP_PROVIDER_BUTTON
              value: "true"
            - name: OAUTH2_PROXY_SKIP_OIDC_DISCOVERY
              value: "true"
            - name: OAUTH2_PROXY_COOKIE_NAME
              value: "_oauth2_proxy_openems"
            - name: OAUTH2_PROXY_COOKIE_SECURE
              value: "false"
            - name: OAUTH2_PROXY_COOKIE_SAMESITE
              value: "lax"
            - name: OAUTH2_PROXY_COOKIE_DOMAIN
              value: "smartgrid.local"
            - name: OAUTH2_PROXY_WHITELIST_DOMAINS
              value: "*"
            - name: OAUTH2_PROXY_SESSION_STORE_TYPE
              value: "redis"
            - name: OAUTH2_PROXY_REDIS_CONNECTION_URL
              value: "redis://redis.smartgrid.svc.cluster.local:6379"
            - name: OAUTH2_PROXY_LOGIN_URL
              value: "http://smartgrid.local/auth/realms/openems/protocol/openid-connect/auth"
            - name: OAUTH2_PROXY_REDEEM_URL
              value: "http://keycloak.smartgrid.svc.cluster.local:8080/auth/realms/openems/protocol/openid-connect/token"
            - name: OAUTH2_PROXY_OIDC_JWKS_URL
              value: "http://keycloak.smartgrid.svc.cluster.local:8080/auth/realms/openems/protocol/openid-connect/certs"
            - name: OAUTH2_PROXY_CODE_CHALLENGE_METHOD
              value: "S256"
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: auth-secrets
                  key: OAUTH2_PROXY_COOKIE_SECRET
          readinessProbe:
            httpGet:
              path: /ping
              port: 4180
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ping
              port: 4180
            initialDelaySeconds: 15
            periodSeconds: 20