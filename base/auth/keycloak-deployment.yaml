apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: smartgrid
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      terminationGracePeriodSeconds: 30

      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.2

          args:
            - start-dev
            - --import-realm
            - --http-relative-path=/auth
            - --http-enabled=true
            - --proxy-headers=xforwarded

          env:
            - name: KC_DB
              value: postgres

            - name: KC_DB_URL
              value: jdbc:postgresql://keycloak-db.smartgrid.svc.cluster.local:5432/keycloak

            - name: KC_DB_USERNAME
              value: keycloak

            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: auth-secrets
                  key: KEYCLOAK_DB_PASSWORD

            - name: KC_HEALTH_ENABLED
              value: "true"

            - name: KC_METRICS_ENABLED
              value: "true"

            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: admin

            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: auth-secrets
                  key: KEYCLOAK_ADMIN_PASSWORD

            # Valori sostituiti nei placeholder ${...} del realm importato
            # (keycloak-realm-configmap.yaml). Nessun secret nel JSON del realm.
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: auth-secrets
                  key: OAUTH2_PROXY_CLIENT_SECRET

            - name: KEYCLOAK_TESTUSER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: auth-secrets
                  key: KEYCLOAK_TESTUSER_PASSWORD

            # URL pubblico fisso: l'issuer dei token è sempre
            # http://smartgrid.local/auth/realms/openems, qualunque indirizzo si usi
            # per chiamare Keycloak (è l'issuer che oauth2-proxy si aspetta).
            - name: KC_HOSTNAME
              value: "http://smartgrid.local/auth"

            # Le chiamate server-to-server (oauth2-proxy -> token/certs via
            # keycloak.smartgrid.svc.cluster.local:8080) restano sull'indirizzo interno.
            # Richiede KC_HOSTNAME espresso come URL completo.
            - name: KC_HOSTNAME_BACKCHANNEL_DYNAMIC
              value: "true"

            - name: KC_PROXY_HEADERS
              value: xforwarded

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            # Interfaccia di management (health/metrics), non esposta dal Service.
            - name: management
              containerPort: 9000
              protocol: TCP

          volumeMounts:
            - name: keycloak-realm-import
              mountPath: /opt/keycloak/data/import
              readOnly: true

          resources:
            requests:
              cpu: "100m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"

          # Probe HTTP sugli endpoint di health di Keycloak (KC_HEALTH_ENABLED=true).
          # Sono sulla porta di management 9000; il percorso eredita
          # --http-relative-path, quindi è /auth/health/...
          # /health/ready verifica anche la connessione al database: il pod non riceve
          # traffico finché Keycloak non è davvero in grado di rispondere ai login.
          startupProbe:
            httpGet:
              path: /auth/health/started
              port: management
            periodSeconds: 5
            failureThreshold: 72

          readinessProbe:
            httpGet:
              path: /auth/health/ready
              port: management
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          # Con lo startupProbe non serve più il ritardo di 180 s: la liveness parte
          # solo dopo che l'avvio è riuscito.
          livenessProbe:
            httpGet:
              path: /auth/health/live
              port: management
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6

      volumes:
        - name: keycloak-realm-import
          configMap:
            name: keycloak-realm-import