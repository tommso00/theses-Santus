apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm-import
  namespace: smartgrid
data:
  openems-realm.json: |
    {
      "realm": "openems",
      "enabled": true,
      "displayName": "OpenEMS",
      "registrationAllowed": false,
      "loginWithEmailAllowed": true,
      "duplicateEmailsAllowed": false,
      "resetPasswordAllowed": true,
      "rememberMe": true,
      "users": [
        {
          "username": "testuser",
          "enabled": true,
          "emailVerified": true,
          "firstName": "Test",
          "lastName": "User",
          "email": "testuser@example.com",
          "credentials": [
            {
              "type": "password",
              "value": "${KEYCLOAK_TESTUSER_PASSWORD}",
              "temporary": false
            }
          ],
          "realmRoles": [
            "default-roles-openems"
          ]
        }
      ],
      "clients": [
        {
          "clientId": "openems-gateway",
          "name": "openems-gateway",
          "enabled": true,
          "protocol": "openid-connect",
          "publicClient": false,
          "bearerOnly": false,
          "standardFlowEnabled": true,
          "implicitFlowEnabled": false,
          "directAccessGrantsEnabled": false,
          "serviceAccountsEnabled": false,
          "frontchannelLogout": true,
          "fullScopeAllowed": true,
          "secret": "${OAUTH2_PROXY_CLIENT_SECRET}",
          "redirectUris": [
            "http://smartgrid.local/oauth2/callback"
          ],
          "webOrigins": [
            "http://smartgrid.local"
          ],
          "attributes": {
            "pkce.code.challenge.method": "S256"
          },
          "defaultClientScopes": [
            "web-origins",
            "acr",
            "profile",
            "roles",
            "email"
          ],
          "optionalClientScopes": [
            "address",
            "phone",
            "offline_access",
            "microprofile-jwt"
          ],
          "protocolMappers": [
            {
              "name": "aud-mapper-openems-gateway",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-audience-mapper",
              "consentRequired": false,
              "config": {
                "included.client.audience": "openems-gateway",
                "id.token.claim": "true",
                "access.token.claim": "true"
              }
            }
          ]
        }
      ]
    }