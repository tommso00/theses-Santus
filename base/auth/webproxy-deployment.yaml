apiVersion: apps/v1
kind: Deployment
metadata:
  name: webproxy
  namespace: smartgrid
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webproxy
  template:
    metadata:
      labels:
        app: webproxy
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
          readinessProbe:
            httpGet:
              path: /monitor/
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /monitor/
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: nginx-conf
          configMap:
            name: webproxy-nginx-conf