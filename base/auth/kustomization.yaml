apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# I secret NON sono più versionati: vengono generati dal file locale
# auth-secrets.env (ignorato da Git). Copiare auth-secrets.env.example
# in auth-secrets.env e compilare i valori prima di "kubectl apply -k".
secretGenerator:
  - name: auth-secrets
    envs:
      - auth-secrets.env
    options:
      disableNameSuffixHash: true

resources:
  - keycloak-realm-configmap.yaml
  - keycloak-db-pvc.yaml
  - keycloak-db-service.yaml
  - keycloak-db-deployment.yaml
  - keycloak-service.yaml
  - keycloak-deployment.yaml
  - redis.yaml
  - oauth2-proxy-service.yaml
  - oauth2-proxy-deployment.yaml
  - webproxy-configmap.yaml
  - webproxy-service.yaml
  - webproxy-deployment.yaml
  - webproxy-ingress.yaml