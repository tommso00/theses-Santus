apiVersion: apps/v1
kind: Deployment
metadata:
  name: bridge-1
  namespace: smartgrid
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bridge-1
  template:
    metadata:
      labels:
        app: bridge-1
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 0
        fsGroup: 0
      initContainers:
        - name: wait-openems
          image: busybox:1.36
          command:
            - sh
            - -c
            - >
              until nc -z openems.smartgrid.svc.cluster.local 8084;
              do echo "waiting for openems"; sleep 3; done
        - name: wait-pdc
          image: busybox:1.36
          command:
            - sh
            - -c
            - >
              until nc -z pdc-edge.smartgrid.svc.cluster.local 8900;
              do echo "waiting for pdc-edge"; sleep 3; done
      containers:
        - name: bridge-1
          image: ghcr.io/tommso00/pmu-bridge:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: PDC_ID
              value: "1"
            - name: PDC_HOST
              value: "pdc-edge.smartgrid.svc.cluster.local"
            - name: PDC_PORT
              value: "8900"
            - name: PDC_COMPONENT
              value: "ess0"
            - name: PDC_CHANNEL
              value: "SetActivePowerEquals"
            - name: OPENEMS_BASE
              value: "http://openems.smartgrid.svc.cluster.local:8084"
            - name: OPENEMS_USER
              value: "admin"
            - name: OPENEMS_PASS
              value: "admin"
            - name: PUBLISH_INTERVAL_S
              value: "1.0"
            - name: RECV_TIMEOUT_S
              value: "5.0"
            - name: CONNECT_RETRY_S
              value: "10.0"
            - name: STALE_DATA_S
              value: "10.0"
            - name: STATUS_INTERVAL_S
              value: "30.0"
            - name: STARTUP_DELAY_S
              value: "15.0"
            - name: HTTP_PORT
              value: "8000"
            - name: IDCODE
              value: "235"
            - name: EXPECTED_DATA_IDCODE
              value: "235"
            - name: EXPECTED_DATA_FRAMESIZE
              value: "68"
            - name: PHASOR_COUNT
              value: "5"
            - name: PUBLISH_PHASOR_INDEX
              value: "1"
            - name: PHASOR1_LABEL
              value: "PHASOR_1"
            - name: PHASOR2_LABEL
              value: "PHASOR_2"
            - name: PHASOR3_LABEL
              value: "PHASOR_3"
            - name: PHASOR4_LABEL
              value: "PHASOR_4"
            - name: PHASOR5_LABEL
              value: "PHASOR_5"
            - name: P_EQ_SCALE
              value: "0.001"
            - name: USE_SYNTHETIC_DATA
              value: "false"
            - name: ALLOW_SYNTHETIC_FALLBACK
              value: "true"
            - name: LOG_LEVEL
              value: "INFO"
      startupProbe:
        httpGet:
          path: /health
          port: 8000
        failureThreshold: 12
        periodSeconds: 5
      livenessProbe:
        httpGet:
          path: /health
          port: 8000
        initialDelaySeconds: 20
        periodSeconds: 15
      readinessProbe:
        exec:
          command:
            - python
            - -c
            - |
              import json, urllib.request, sys
              data = json.load(urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=2))
              sys.exit(0 if data.get("fresh") else 1)
        initialDelaySeconds: 20
        periodSeconds: 10
      resources:
        requests:
          memory: "128Mi"
          cpu: "100m"
        limits:
          memory: "256Mi"
          cpu: "500m"