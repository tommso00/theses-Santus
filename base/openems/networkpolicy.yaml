# Accesso in ingresso a OpenEMS Edge.
# Solo i bridge PMU (REST 8084) e il WebProxy (REST 8084 per /edge-jsonrpc,
# WebSocket 8085 per /edge-ws/) possono raggiungere l'Edge. Tutto il resto è bloccato,
# compresa la console Felix sulla 8080.
# Le probe del kubelet non sono interessate: il traffico dal nodo verso i suoi pod
# è sempre permesso dalle NetworkPolicy.
# Il traffico in uscita dall'Edge (es. verso openems-backend:8081) non è limitato.
# Verificato che il CNI del cluster (kindnet) applica le NetworkPolicy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openems-edge-ingress
  namespace: smartgrid
spec:
  podSelector:
    matchLabels:
      app: openems
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: ["bridge-1", "bridge-2", "bridge-3"]
      ports:
        - protocol: TCP
          port: 8084
    - from:
        - podSelector:
            matchLabels:
              app: webproxy
      ports:
        - protocol: TCP
          port: 8084
        - protocol: TCP
          port: 8085
