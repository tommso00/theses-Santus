apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openems-conf
  namespace: smartgrid
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openems-data
  namespace: smartgrid
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi