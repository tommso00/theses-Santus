apiVersion: apps/v1
kind: Deployment
metadata:
  name: openems
  namespace: smartgrid
  labels:
    environment: minikube
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: openems
  template:
    metadata:
      labels:
        app: openems
    spec:
      initContainers:
        - name: initialize-openems-config
          image: alpine:3.20
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              set -eu

              mkdir -p \
                /var/opt/openems/config/Controller/Api/Backend \
                /var/opt/openems/config/Controller/Api/Websocket \
                /var/opt/openems/config/Controller/Api/Rest/ReadWrite \
                /var/opt/openems/config/Scheduler/AllAlphabetically

              cat > /var/opt/openems/config/Controller/Api/Backend/backend0.config <<'EOF'
              enabled=B"true"
              uri="ws://openems-backend:8081"
              apikey="edge0"
              id="ctrlBackend0"
              service.factoryPid="Controller.Api.Backend"
              service.pid="Controller.Api.Backend.backend0"
              EOF

              cat > /var/opt/openems/config/Controller/Api/Websocket/websocket0.config <<'EOF'
              alias=""
              apiTimeout=I"60"
              enabled=B"true"
              id="ctrlApiWebsocket0"
              port=I"8085"
              service.factoryPid="Controller.Api.Websocket"
              service.pid="Controller.Api.Websocket.websocket0"
              EOF

              # REST API in lettura/scrittura (usata dai bridge PMU per scrivere i setpoint).
              # La factory corretta è "Controller.Api.Rest.ReadWrite": il vecchio file con
              # factoryPid "Controller.Api.Rest" non corrispondeva a nessun componente OpenEMS.
              rm -f /var/opt/openems/config/Controller/Api/Rest/rest0.config

              REST_DIR=/var/opt/openems/config/Controller/Api/Rest/ReadWrite
              OTHER_REST=$(find "$REST_DIR" -name '*.config' ! -name 'rest0.config' | head -n 1)
              if [ -n "$OTHER_REST" ]; then
                # Esiste già un controller REST creato a mano (es. dalla UI): non ne creo
                # un secondo sulla stessa porta 8084.
                echo "REST ReadWrite già presente ($OTHER_REST): salto la creazione di rest0"
              else
                cat > "$REST_DIR/rest0.config" <<'EOF'
              enabled=B"true"
              port=I"8084"
              service.pid="Controller.Api.Rest.ReadWrite.rest0"
              service.factoryPid="Controller.Api.Rest.ReadWrite"
              id="ctrlApiRest0"
              alias=""
              apiTimeout=I"60"
              debugMode=B"false"
              EOF
              fi

              chown -R 911:911 /var/opt/openems/config/Controller
              chown -R 911:911 /var/opt/openems/config/Scheduler

              chmod -R u+rwX,go+rX /var/opt/openems/config/Controller
              chmod -R u+rwX,go+rX /var/opt/openems/config/Scheduler
          volumeMounts:
            - name: openems-conf
              mountPath: /var/opt/openems/config

        - name: simulator-config-init
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
          args:
            - |
              set -e

              mkdir -p /var/opt/openems/config/Simulator/Datasource/CSVPredefined
              mkdir -p /var/opt/openems/config/Simulator/GridMeter/Acting
              mkdir -p /var/opt/openems/config/Simulator/EssAsymmetric/Reacting
              mkdir -p /var/opt/openems/config/Controller/DebugLog
              mkdir -p /var/opt/openems/config/Controller/Ess/Balancing
              mkdir -p /var/opt/openems/config/Scheduler/AllAlphabetically

              cp /init-config/datasource0.config \
                /var/opt/openems/config/Simulator/Datasource/CSVPredefined/datasource0.config

              cp /init-config/meter0.config \
                /var/opt/openems/config/Simulator/GridMeter/Acting/meter0.config

              cp /init-config/ess0.config \
                /var/opt/openems/config/Simulator/EssAsymmetric/Reacting/ess0.config

              cp /init-config/debuglog0.config \
                /var/opt/openems/config/Controller/DebugLog/debuglog0.config

              cp /init-config/balancing0.config \
                /var/opt/openems/config/Controller/Ess/Balancing/balancing0.config

              cp /init-config/scheduler0.config \
                /var/opt/openems/config/Scheduler/AllAlphabetically/scheduler0.config

              # I manifest sono la fonte della verità: se nel PVC esiste un'altra
              # configurazione con lo stesso id di un componente gestito qui (es. creata
              # a mano dalla UI), OpenEMS va in FAULT "duplicated Component-IDs".
              # La rimuovo, lasciando solo il file scritto dagli initContainer.
              cd /var/opt/openems/config
              MANAGED="
                Controller/Api/Backend/backend0.config
                Controller/Api/Websocket/websocket0.config
                Controller/Api/Rest/ReadWrite/rest0.config
                Simulator/Datasource/CSVPredefined/datasource0.config
                Simulator/GridMeter/Acting/meter0.config
                Simulator/EssAsymmetric/Reacting/ess0.config
                Controller/DebugLog/debuglog0.config
                Controller/Ess/Balancing/balancing0.config
                Scheduler/AllAlphabetically/scheduler0.config
              "
              for f in $MANAGED; do
                [ -f "$f" ] || continue
                idline=$(grep -m1 '^id=' "$f") || continue
                find . -name '*.config' | while read -r g; do
                  [ "$g" = "./$f" ] && continue
                  if grep -qxF "$idline" "$g"; then
                    echo "Rimuovo configurazione duplicata ($idline): $g"
                    rm -f "$g"
                  fi
                done
              done

              chown -R 911:911 /var/opt/openems/config
              chmod -R u+rwX,go+rX /var/opt/openems/config
          volumeMounts:
            - name: openems-conf
              mountPath: /var/opt/openems/config
            - name: openems-simulator-config
              mountPath: /init-config

      containers:
        - name: openems
          image: openems/edge:latest   # versione fissata con digest in base/kustomization.yaml
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              protocol: TCP
            - containerPort: 8084
              protocol: TCP
            - containerPort: 8085
              protocol: TCP
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "750m"
              memory: "512Mi"
          readinessProbe:
            tcpSocket:
              port: 8085
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: 8085
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: openems-conf
              mountPath: /var/opt/openems/config
            - name: openems-data
              mountPath: /var/opt/openems/data

      volumes:
        - name: openems-conf
          persistentVolumeClaim:
            claimName: openems-conf
        - name: openems-data
          persistentVolumeClaim:
            claimName: openems-data
        - name: openems-simulator-config
          configMap:
            name: openems-simulator-config