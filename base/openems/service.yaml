apiVersion: v1
kind: Service
metadata:
  name: openems
  namespace: smartgrid
spec:
  selector:
    app: openems
  ports:
    - name: api
      port: 8084
      targetPort: 8084
    - name: ws
      port: 8085
      targetPort: 8085
    - name: http
      port: 8080
      targetPort: 8080
  type: ClusterIP