apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: smartgrid

resources:
  - namespace.yaml
  - networkpolicy-default-deny.yaml
  - auth/
  - openems/
  - apps/openems-backend/
  - apps/openems-ui-backend/
  - apps/pdc-edge/
  - apps/pdc-edge-2/
  - apps/pdc-edge-3/
  - apps/bridge-1/
  - apps/bridge-2/
  - apps/bridge-3/

# Versioni fissate: ogni immagine è bloccata al digest che girava sul cluster
# funzionante (cluster-state.yaml, 2026-09-10). Il tag resta solo come etichetta
# leggibile: conta il digest, quindi un "latest" ripubblicato non cambia nulla.
# Per aggiornare un'immagine: cambiare tag, poi prendere il nuovo digest con
#   docker pull <immagine>:<tag>; docker inspect --format '{{index .RepoDigests 0}}' <immagine>:<tag>
images:
  - name: gridprotectionalliance/openpdc
    newTag: "v2.9.148@sha256:f1c7705904a0fda7100b4ab64107ddaf7863c26de65dcd924b4e9bf3c1f829fc"
