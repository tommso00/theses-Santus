# Default deny in ingresso per tutto il namespace smartgrid.
# Ogni pod (anche quelli aggiunti in futuro o lanciati a mano, es. kubectl run)
# non riceve traffico da altri pod finché una NetworkPolicy non lo permette
# esplicitamente. Le regole "allow" stanno accanto a ogni servizio
# (auth/, openems/, apps/*/networkpolicy.yaml).
#
# Non interessati dalla policy:
#   - probe del kubelet (traffico dal nodo verso i suoi pod);
#   - kubectl port-forward / exec (passano dal kubelet, non dalla rete dei pod).
# Il traffico in USCITA non è limitato (DNS, Edge -> Backend, ecc. restano liberi).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: smartgrid
spec:
  podSelector: {}
  policyTypes:
    - Ingress
