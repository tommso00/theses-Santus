apiVersion: apps/v1
kind: Deployment
metadata:
  name: bridge-1
  namespace: smartgrid
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: bridge-1
  template:
    metadata:
      labels:
        app: bridge-1
    spec:
      initContainers:
        - name: wait-pdc
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z pdc-edge 8900; do sleep 2; done"]
        - name: wait-openems
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z openems 8085; do sleep 2; done"]
      containers:
        - name: bridge
          image: pmu-bridge:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: PDC_ID
              value: "1"
            - name: PDC_HOST
              value: "pdc-edge"
            - name: PDC_PORT
              value: "8900"
            - name: PDC_COMPONENT
              value: "ess0"
            - name: PDC_CHANNEL
              value: "SetActivePowerEquals"
            - name: OPENEMS_BASE
              value: "http://openems:8084"
            - name: OPENEMS_USER
              value: "admin"
            - name: OPENEMS_PASS
              value: "admin"
            - name: PUBLISH_INTERVAL_S
              value: "1.0"
            - name: RECV_TIMEOUT_S
              value: "5.0"
            - name: CONNECT_RETRY_S
              value: "10.0"
            - name: STALE_DATA_S
              value: "10.0"
            - name: STATUS_INTERVAL_S
              value: "30.0"
            - name: STARTUP_DELAY_S
              value: "15.0"
            - name: HTTP_PORT
              value: "8000"
            - name: IDCODE
              value: "235"
            - name: EXPECTED_DATA_IDCODE
              value: "235"
            - name: EXPECTED_DATA_FRAMESIZE
              value: "68"
            - name: PHASOR_COUNT
              value: "5"
            - name: PUBLISH_PHASOR_INDEX
              value: "1"
            - name: PHASOR1_LABEL
              value: "PHASOR_1"
            - name: PHASOR2_LABEL
              value: "PHASOR_2"
            - name: PHASOR3_LABEL
              value: "PHASOR_3"
            - name: PHASOR4_LABEL
              value: "PHASOR_4"
            - name: PHASOR5_LABEL
              value: "PHASOR_5"
            - name: P_EQ_SCALE
              value: "0.001"
            - name: USE_SYNTHETIC_DATA
              value: "false"
            - name: ALLOW_SYNTHETIC_FALLBACK
              value: "true"
            - name: LOG_LEVEL
              value: "INFO"
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"