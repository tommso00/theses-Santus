apiVersion: apps/v1
kind: Deployment
metadata:
  name: openems-ui
  namespace: smartgrid
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openems-ui
  template:
    metadata:
      labels:
        app: openems-ui
    spec:
      containers:
        - name: openems-ui
          image: openems/ui-edge
          env:
            - name: WEBSOCKET_HOST
              value: smartgrid.local
            - name: WEBSOCKET_PORT
              value: "80"
          ports:
            - containerPort: 80