# Accesso in ingresso a openPDC (pdc-edge-2).
#   bridge-2 -> 8900  stream IEEE C37.118 (unico consumatore di questa istanza)
# Chiuse a tutti i pod: UI web 8280 (si usa con kubectl port-forward, che la policy
# non blocca) e porta 6165. Le probe del kubelet non sono interessate.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pdc-edge-2-ingress
  namespace: smartgrid
spec:
  podSelector:
    matchLabels:
      app: pdc-edge-2
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: bridge-2
      ports:
        - protocol: TCP
          port: 8900
