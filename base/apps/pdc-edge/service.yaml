apiVersion: v1
kind: Service
metadata:
  name: pdc-edge
  namespace: smartgrid
spec:
  selector:
    app: pdc-edge
  ports:
    - name: http
      port: 8280
      targetPort: 8280
      protocol: TCP
    - name: stream
      port: 8900
      targetPort: 8900
      protocol: TCP
    - name: alt
      port: 6165
      targetPort: 6165
      protocol: TCP
  type: ClusterIP