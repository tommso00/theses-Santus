apiVersion: apps/v1
kind: Deployment
metadata:
  name: pdc-edge
  namespace: smartgrid
spec:
  replicas: 1
  # Un solo pod alla volta sul database SQLite (PVC ReadWriteOnce).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pdc-edge
  template:
    metadata:
      labels:
        app: pdc-edge
    spec:
      initContainers:
        # Al primo avvio il PVC è vuoto: copia la configurazione di default
        # dell'immagine (openPDC.db incluso). Agli avvii successivi non tocca nulla,
        # così le modifiche fatte dalla UI di openPDC sopravvivono ai riavvii.
        - name: seed-config
          image: gridprotectionalliance/openpdc:v2.9.148
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              if [ -f /seed/openPDC.db ]; then
                echo "openPDC.db già presente nel PVC: nessuna copia"
              else
                echo "PVC vuoto: copio la configurazione di default"
                cp -a /opt/openPDC/ConfigurationCache/. /seed/
              fi
          volumeMounts:
            - name: openpdc-config
              mountPath: /seed
      containers:
        - name: pdc-edge
          image: gridprotectionalliance/openpdc:v2.9.148
          ports:
            - containerPort: 8280
            - containerPort: 8900
            - containerPort: 6165
          volumeMounts:
            # Database di configurazione (openPDC.db) e cache della configurazione.
            - name: openpdc-config
              mountPath: /opt/openPDC/ConfigurationCache
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1"
          # openPDC (Mono) può metterci qualche minuto ad avviarsi su minikube.
          startupProbe:
            tcpSocket:
              port: 8280
            periodSeconds: 5
            failureThreshold: 60
          # Pronto quando lo stream IEEE C37.118 usato dai bridge accetta connessioni.
          readinessProbe:
            tcpSocket:
              port: 8900
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 8280
            periodSeconds: 20
            failureThreshold: 3
      volumes:
        - name: openpdc-config
          persistentVolumeClaim:
            claimName: pdc-edge-config
