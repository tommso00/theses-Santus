apiVersion: apps/v1
kind: Deployment
metadata:
  name: openems-ui-backend
  namespace: smartgrid
  labels:
    environment: minikube
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openems-ui-backend
  template:
    metadata:
      labels:
        app: openems-ui-backend
    spec:
      containers:
        - name: openems-ui-backend
          image: openems/ui-backend:2025.1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: WEBSOCKET_HOST
              value: openems-backend
            - name: WEBSOCKET_PORT
              value: "8082"
            - name: UI_WEBSOCKET
              value: ws://openems-backend:8082/
          ports:
            - containerPort: 80
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: env-config
              mountPath: /var/www/html/openems/assets/env.js
              subPath: env.js
              readOnly: true
      volumes:
        - name: env-config
          configMap:
            name: ui-backend-env
            items:
              - key: env.js
                path: env.js