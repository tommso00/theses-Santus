# Accesso in ingresso alla UI di OpenEMS: solo dal WebProxy (/ e /backend-ui/, dietro login).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openems-ui-backend-ingress
  namespace: smartgrid
spec:
  podSelector:
    matchLabels:
      app: openems-ui-backend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: webproxy
      ports:
        - protocol: TCP
          port: 80
