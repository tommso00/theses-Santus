# Accesso in ingresso a OpenEMS Backend.
#   openems (Edge)      -> 8081  WebSocket degli Edge (ctrlBackend0, ws://openems-backend:8081)
#   webproxy            -> 8082  WebSocket della UI (/backend-ws/, /openems-edge)
#   openems-ui-backend  -> 8082  WebSocket della UI (WEBSOCKET_HOST/UI_WEBSOCKET del container)
# Chiuse a tutti i pod: console Felix (8079) e API 8093, che nessun servizio usa.
# Restano raggiungibili con kubectl port-forward e dalle probe del kubelet.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openems-backend-ingress
  namespace: smartgrid
spec:
  podSelector:
    matchLabels:
      app: openems-backend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: openems
      ports:
        - protocol: TCP
          port: 8081
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: ["webproxy", "openems-ui-backend"]
      ports:
        - protocol: TCP
          port: 8082
