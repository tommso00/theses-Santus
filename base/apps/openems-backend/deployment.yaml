apiVersion: apps/v1
kind: Deployment
metadata:
  name: openems-backend
  namespace: smartgrid
  labels:
    environment: minikube
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: openems-backend
  template:
    metadata:
      labels:
        app: openems-backend
    spec:
      initContainers:
        - name: initialize-openems-backend-config
          image: busybox:1.36
          command:
            - /bin/sh
            - -ec
            - |
              mkdir -p /var/opt/openems/config/Edge
              mkdir -p /var/opt/openems/config/Metadata
              mkdir -p /var/opt/openems/config/Ui

              cp /bootstrap/Edge__Websocket.config /var/opt/openems/config/Edge/Websocket.config
              cp /bootstrap/Metadata__File.config /var/opt/openems/config/Metadata/File.config
              cp /bootstrap/Ui__Websocket.config /var/opt/openems/config/Ui/Websocket.config
              cp /metadata/metadata.json /var/opt/openems/config/metadata.json

              chmod 0644 /var/opt/openems/config/Edge/Websocket.config
              chmod 0644 /var/opt/openems/config/Metadata/File.config
              chmod 0644 /var/opt/openems/config/Ui/Websocket.config
              chmod 0644 /var/opt/openems/config/metadata.json
          volumeMounts:
            - name: openems-backend-conf
              mountPath: /var/opt/openems/config
            - name: backend-bootstrap
              mountPath: /bootstrap
              readOnly: true
            - name: metadata
              mountPath: /metadata
              readOnly: true

      containers:
        - name: openems-backend
          image: openems/backend:2025.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8079
              name: felix
              protocol: TCP
            - containerPort: 8081
              name: edge-ws
              protocol: TCP
            - containerPort: 8082
              name: ui-ws
              protocol: TCP
            - containerPort: 8093
              name: api
              protocol: TCP
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          # Le probe controllano le porte che servono davvero, non la console Felix (8079).
          # In OpenEMS 2025.1.0 Edge.Websocket (8081) può non partire mai per una race
          # con Metadata.File all'avvio, senza errori nei log. Se entro ~2 minuti la 8081
          # non è aperta, il container viene riavviato e la race si ripresenta raramente.
          startupProbe:
            tcpSocket:
              port: 8081
            periodSeconds: 5
            failureThreshold: 24
          # Pronto per la UI quando il WebSocket della UI (8082) accetta connessioni.
          readinessProbe:
            tcpSocket:
              port: 8082
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 8081
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: openems-backend-conf
              mountPath: /var/opt/openems/config
            - name: openems-backend-data
              mountPath: /var/opt/openems/data

      volumes:
        - name: openems-backend-conf
          persistentVolumeClaim:
            claimName: openems-backend-conf
        - name: openems-backend-data
          persistentVolumeClaim:
            claimName: openems-backend-data
        - name: backend-bootstrap
          configMap:
            name: openems-backend-config
        - name: metadata
          configMap:
            name: openems-metadata
            items:
              - key: metadata.json
                path: metadata.json