apiVersion: v1
kind: ConfigMap
metadata:
  name: openems-backend-config
  namespace: smartgrid
data:
  Edge__Websocket.config: |
    :org.apache.felix.configadmin.revision:=L"1"
    poolSize=I"10"
    port=I"8081"
    service.pid="Edge.Websocket"

  Metadata__File.config: |
    :org.apache.felix.configadmin.revision:=L"1"
    path="/var/opt/openems/config/metadata.json"
    service.pid="Metadata.File"

  Ui__Websocket.config: |
    :org.apache.felix.configadmin.revision:=L"3"
    poolSize=I"10"
    port=I"8082"
    service.pid="Ui.Websocket"