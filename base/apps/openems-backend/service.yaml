apiVersion: v1
kind: Service
metadata:
  name: openems-backend
  namespace: smartgrid
spec:
  selector:
    app: openems-backend
  ports:
    - name: edge-websocket
      port: 8081
      targetPort: 8081
    - name: ui-websocket
      port: 8082
      targetPort: 8082
    - name: api
      port: 8093
      targetPort: 8093
    - name: felix
      port: 8079
      targetPort: 8079
  type: ClusterIP