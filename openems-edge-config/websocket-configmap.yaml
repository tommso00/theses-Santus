apiVersion: v1
kind: ConfigMap
metadata:
  name: openems-edge-websocket-config
  namespace: smartgrid
data:
  Websocket.config: |
    enabled=B"true"
    uri="ws://openems-backend:8081"
    apikey="edge0"
    id="ctrlBackend0"
    service.factoryPid="Controller.Api.Backend"
    service.pid="Controller.Api.Backend.backend0"

  Scheduler.config: |
    enabled=B"true"
    service.pid="Scheduler.AllAlphabetically"