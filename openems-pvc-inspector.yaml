apiVersion: v1
kind: Pod
metadata:
  name: openems-pvc-inspector
  namespace: smartgrid
spec:
  restartPolicy: Never
  containers:
    - name: inspector
      image: alpine:3.20
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts:
        - name: openems-config
          mountPath: /var/opt/openems/config
        - name: openems-data
          mountPath: /var/opt/openems/data
  volumes:
    - name: openems-config
      persistentVolumeClaim:
        claimName: openems-conf
    - name: openems-data
      persistentVolumeClaim:
        claimName: openems-data